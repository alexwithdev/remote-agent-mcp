name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build all platforms
        run: ./build.sh all

      - name: Generate checksums
        working-directory: output
        run: sha256sum * > checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            output/remote-agent-mcp
            output/remote-agent-mcp-linux-amd64
            output/remote-agent-mcp-linux-arm64
            output/remote-agent-mcp-darwin-amd64
            output/remote-agent-mcp-darwin-arm64
            output/remote-agent-mcp-windows-amd64.exe
            output/checksums.txt
